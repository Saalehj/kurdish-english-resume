<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ronika TV</title>
    
    <link rel="icon" href="./AppLogo.jpg" type="image/jpeg">
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#060913">
    <link rel="apple-touch-icon" href="./AppLogo.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ronika TV">

    <style>
        :root {
            --bg-base: #060913;
            --bg-glass: rgba(20, 25, 40, 0.6);
            --accent-1: #00bcd4;
            --accent-2: #8a2be2;
            --text-main: #ffffff;
            --text-muted: #8b95a5;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 10% 20%, rgba(138, 43, 226, 0.1) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(0, 188, 212, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            margin: 0; padding: 0; 
            height: 100vh; height: 100dvh; 
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* وقتی آیفون در حالت شبیه‌ساز فول‌اسکرین است، بقیه عناصر مخفی می‌شوند */
        body.pseudo-fs-active .header,
        body.pseudo-fs-active .channel-sidebar {
            display: none !important;
        }

        .header {
            flex-shrink: 0; display: flex; justify-content: space-between; align-items: center;
            padding: 15px 25px; background: rgba(10, 14, 23, 0.8);
            backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); z-index: 1000;
        }

        .brand-container { display: flex; align-items: center; gap: 15px; }
        .app-logo-img { width: 45px; height: 45px; border-radius: 12px; border: 2px solid var(--accent-1); box-shadow: 0 0 15px rgba(0, 188, 212, 0.3); }
        .app-title { margin: 0; font-size: 22px; font-weight: 900; background: linear-gradient(to right, var(--accent-1), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .header-buttons { display: flex; gap: 10px; align-items: center; }
        .modern-btn {
            background: var(--bg-glass); border: 1px solid var(--border); color: #fff;
            padding: 8px 16px; border-radius: 20px; font-weight: bold; font-family: inherit;
            cursor: pointer; transition: 0.3s; backdrop-filter: blur(5px);
        }
        .modern-btn:hover { background: var(--accent-2); border-color: var(--accent-2); }
        
        /* استایل نشان تعداد کانال‌ها */
        .stats-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--accent-1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
        }
        #total-count { color: #fff; }

        .main-content { display: flex; flex-direction: row; flex: 1; overflow: hidden; position: relative; min-height: 0; }

        .player-section { 
            flex: 1; display: flex; flex-direction: column; background: #000; 
            position: relative; z-index: 50; height: 100%; min-width: 0;
        }

        .channel-sidebar {
            width: 340px; background: var(--bg-glass); border-left: 1px solid var(--border);
            display: flex; flex-direction: column; z-index: 20; backdrop-filter: blur(10px);
        }

        .search-container { padding: 15px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .search-input {
            width: 100%; padding: 12px 15px; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            border-radius: 12px; color: #fff; font-family: inherit; outline: none; transition: 0.3s;
        }
        .search-input:focus { border-color: var(--accent-1); box-shadow: 0 0 10px rgba(0, 188, 212, 0.2); }

        .category-tabs { 
            display: flex; flex-wrap: nowrap; overflow-x: auto; padding: 10px 15px; gap: 8px; 
            border-bottom: 1px solid var(--border); flex-shrink: 0; scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .category-tabs::-webkit-scrollbar { display: none; }
        .tab-btn {
            background: rgba(0,0,0,0.4); color: var(--text-muted); border: 1px solid transparent;
            padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 13px; white-space: nowrap; transition: 0.3s;
        }
        .tab-btn.active { background: linear-gradient(45deg, var(--accent-1), var(--accent-2)); color: #fff; font-weight: bold; }

        .channel-list { 
            padding: 15px; overflow-y: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; 
            padding-bottom: 20px; -webkit-overflow-scrolling: touch;
        }
        .channel-list::-webkit-scrollbar { width: 5px; }
        .channel-list::-webkit-scrollbar-thumb { background: var(--accent-2); border-radius: 10px; }

        .channel-item {
            display: flex; align-items: center; gap: 12px; padding: 10px 15px;
            background: rgba(255,255,255,0.03); border-radius: 12px; cursor: pointer; border: 1px solid var(--border); transition: 0.3s;
            flex-shrink: 0;
        }
        .channel-item:hover { background: rgba(255,255,255,0.08); transform: translateY(-2px); }
        .channel-item.active { background: rgba(0, 188, 212, 0.1); border-color: var(--accent-1); box-shadow: inset 0 0 20px rgba(0, 188, 212, 0.1); }

        .channel-logo-wrapper { width: 45px; height: 45px; border-radius: 50%; background: transparent; padding: 2px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
        .channel-logo { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
        .channel-name { font-size: 15px; font-weight: 700; color: #fff; flex: 1; }
        
        .fav-btn { background: none; border: none; font-size: 20px; cursor: pointer; transition: 0.3s; }
        .fav-btn.favorited { text-shadow: 0 0 15px rgba(255, 0, 0, 0.6); transform: scale(1.1); }

        .developer-info {
            background: rgba(0, 0, 0, 0.4); border-top: 1px solid var(--border);
            padding: 10px 5px; text-align: center; flex-shrink: 0; font-size: 11px;
            color: var(--text-muted); display: flex; justify-content: center; align-items: center; gap: 5px;
            flex-wrap: wrap; direction: ltr;
        }
        .developer-info b { color: var(--accent-1); font-weight: bold; }
        .developer-info a { color: var(--text-main); text-decoration: none; opacity: 0.8; transition: 0.3s; }

        .now-playing-bar {
            padding: 12px 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0.7)); 
            border-bottom: 1px solid var(--accent-1); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
        }
        .playing-info { display: flex; flex-direction: column; }
        .now-playing-label { color: var(--accent-1); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        #current-channel-name { color: #fff; font-size: 18px; font-weight: 900; }

        .controls-right { display: flex; gap: 12px; align-items: center; }
        .icon-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; border-radius: 8px; padding: 8px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { background: var(--accent-1); color: #000; }
        .quality-selector { background: rgba(0,0,0,0.5); color: #fff; border: 1px solid var(--accent-1); padding: 5px 10px; border-radius: 8px; font-family: inherit; cursor: pointer; }

        #video-wrapper { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; min-height: 0; }
        
        /* استایل‌های هوشمند فیت اسکرین (چند حالته) */
        video { width: 100%; height: 100%; object-fit: contain; outline: none; transition: object-fit 0.3s ease; }
        
        video::-webkit-media-controls-fullscreen-button { display: none !important; }

        .loader {
            display: none; position: absolute; border: 4px solid rgba(255,255,255,0.1); border-left-color: var(--accent-1);
            border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; z-index: 10;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* شبیه‌ساز فول‌اسکرین ضدضربه برای آیفون */
        .pseudo-fs {
            position: fixed !important; inset: 0 !important;
            width: 100vw !important; height: 100vh !important; height: 100dvh !important;
            z-index: 2147483647 !important; background: #000 !important;
            margin: 0 !important; padding: 0 !important; border: none !important;
        }

        .fs-ui { position: absolute; left: 0; right: 0; padding: 20px; z-index: 2147483647; transition: opacity 0.4s ease; opacity: 0; pointer-events: none; }
        .fs-ui.active { opacity: 1; pointer-events: auto; }

        .fs-header { top: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); display: flex; justify-content: space-between; align-items: flex-start; }
        .fs-title-box { background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); padding: 10px 20px; border-radius: 12px; border: 1px solid var(--accent-1); }
        .fs-title { font-size: 24px; font-weight: 900; color: #fff; margin: 0; }
        
        .fs-controls { display: flex; gap: 10px; align-items: center; }
        .fs-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 12px; border-radius: 8px; font-size: 14px; cursor: pointer; backdrop-filter: blur(5px); transition: 0.3s; }
        .fs-btn:hover { background: var(--accent-1); color: #000; border-color: var(--accent-1); }

        .fs-footer { bottom: 0; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); padding-bottom: max(30px, env(safe-area-inset-bottom)); }
        .fs-channels { display: flex; gap: 15px; overflow-x: auto; padding: 10px; scrollbar-width: none; }
        .fs-channels::-webkit-scrollbar { display: none; }
        .fs-channel-card {
            min-width: 100px; background: rgba(20, 25, 40, 0.8); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: 0.3s; flex-shrink: 0;
        }
        .fs-channel-card.active { border-color: var(--accent-1); background: rgba(0, 188, 212, 0.2); transform: translateY(-5px); }
        .fs-card-logo { width: 50px; height: 50px; border-radius: 50%; background: transparent; padding: 2px; }
        .fs-card-name { color: #fff; font-size: 12px; font-weight: bold; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

        /* باگ فیکس چرخاندن گوشی */
        @media (max-width: 950px) {
            .main-content { flex-direction: column; }
            .player-section { flex: none; height: auto; z-index: 100; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
            #video-wrapper { aspect-ratio: 16/9; height: auto; }
            .channel-sidebar { flex: 1; width: 100%; border-left: none; min-height: 0; }
            .fs-title { font-size: 18px; }
            .fs-channel-card { min-width: 80px; padding: 8px; }
            .fs-card-logo { width: 40px; height: 40px; }
        }

        /* کادر رنگی دور آیتم‌های انتخاب شده با کنترل تلویزیون */
        .tab-btn:focus, .channel-item:focus, .fs-channel-card:focus {
            outline: 3px solid var(--accent-1);
            transform: scale(1.05);
            transition: 0.2s;
        }

/* حالت زوم شده و برش خورده برای سایت‌هایی مثل نگاهستان/نمکده */
#iframe-player.cropped-mode {
    position: absolute;
    /* ابعاد سایت را دستکاری نمی‌کنیم تا پلیر نوار مشکی نسازد */
    width: 100%; 
    height: 100%; 
    top: 0; 
    left: 0; 
    
    /* به مرورگر می‌گوییم دوربین را روی قسمت وسط و بالای سایت تنظیم کند */
    transform-origin: center top; 
    
    /* جادوی نهایی: سایت را یکدست ۱۵ درصد زوم می‌کنیم، و بعد آن را به بالا می‌کشیم */
    transform: scale(1.17) translateY(-12%); 
    
    pointer-events: auto;
}



    </style>
</head>

                        <h3 id="fs-channel-title" class="fs-title">Ronika TV</h3>
                    </div>
                    <div class="fs-controls">
                        <select id="fs-quality-selector" class="fs-btn" onchange="changeQuality(this.value)" style="display:none; background:#1c2025;"></select>
                        <button id="fs-fit-btn" class="fs-btn" onclick="toggleFit()">Aspect: Fit</button>
                        <button class="fs-btn" style="background:rgba(255,0,0,0.5); border:none;" onclick="toggleCustomFullscreen()">X</button>
                    </div>
                </div>

    </div>
    <div class="fs-channels" id="fs-channels-container"></div>
</div>
            </div>
        </div>

        <div class="channel-sidebar">

                <input type="text" id="search-input" class="search-input" placeholder="🔍 گەڕان بۆ کەناڵ..." oninput="searchChannels()">

            <div class="category-tabs">

            { id: "ch98", name: "Gem River", category: "ent", logo: "https://i.imgur.com/yJ6f1B6.png", url: P + "https://ca-rt.onetv.app/gemriver/index-0.m3u8?token=onetv202" },
            { id: "ch99", name: "Gem River  +", category: "ent", logo: "https://gemgroup.tv/assets/images/channels/icon_29.png", url: P + "https://ca-rt.onetv.app/gemriverplus/index-0.m3u8?token=onetv202" },
            { id: "ch100", name: "Gem Classic", category: "ent", logo: "https://i.imgur.com/25BhuOf.png", url: P + "https://ca-rt.onetv.app/gemclassic/index-0.m3u8?token=onetv202" },
            { id: "ch106", name: "Gem Rubix +", category: "ent", logo: "https://gemgroup.tv/assets/images/channels/icon_31.png", url: P + "https://ca-rt.onetv.app/gemrubixplus/index-0.m3u8?token=onetv202" },
	{ id: "ch_gem_river", name: "Gem River", category: "ent", logo: "https://i.imgur.com/yJ6f1B6.png", url: "https://namakade.com/livetvs/RIVER", type: "iframe", crop: true },
{ id: "ch_gem_sport", name: "Gem Sport", category: "sports", logo: "https://www.persianity.com/thumb.php?w=900&h=506&src=https://www.irtv.website/index_files/channels/gemsport.png", url: "https://namakade.com/livetvs/GEM%20SPORT", type: "iframe", crop: true },


     



        ];
        let favorites = JSON.parse(localStorage.getItem('ronika_favs')) || [];
        let activeUrl = "";
        let currentCategory = "all";
        let currentFilteredList = myChannels; 

        const container = document.getElementById('channels-container');
        const fsChannelsContainer = document.getElementById('fs-channels-container');
        const channelTitle = document.getElementById('current-channel-name');
        const fsChannelTitle = document.getElementById('fs-channel-title');
        const loader = document.getElementById('loader');
        const video = document.getElementById('video');
        const iframePlayer = document.getElementById('iframe-player');
        let hls;



	// تابع اسکرول خودکار برای تلویزیون هوشمند
function makeScrollableOnFocus() {
    document.querySelectorAll('.tab-btn, .channel-item, .fs-channel-card').forEach(el => {
        // اضافه کردن قابلیت فوکوس
        el.setAttribute('tabindex', '0');
        
        // وقتی با کنترل تلویزیون روی این آیتم آمدیم، خودش را وسط صفحه بیاورد
        el.addEventListener('focus', function() {
            this.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
        });
        
        // با زدن دکمه OK/Enter روی کنترل، کلیک شبیه‌سازی شود
        el.addEventListener('keydown', function(e) {
            if(e.key === 'Enter') {
                this.click();
            }
        });
    });
}

        function renderChannels(list) {
            currentFilteredList = list;
            container.innerHTML = '';
            fsChannelsContainer.innerHTML = '';

            // --- آپدیت تعداد کانال‌ها و تنظیم زبان کلمه کانال ---
            const chWord = currentLang === 'en' ? 'Channels' : 'کەناڵ';
            const countBadge = document.getElementById('total-count');
            if (countBadge) {
                countBadge.parentElement.innerHTML = `<span id="total-count">${list.length}</span> <span id="channel-word">${chWord}</span>`;
            }
            // ----------------------------------------------------

            if(list.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:#8b95a5;">هیچ کەناڵێک نییە</div>';
                return;
            }

            list.forEach(channel => {
                const isFav = favorites.includes(channel.id);
                
                const div = document.createElement('div');
                div.className = 'channel-item';
                div.dataset.id = channel.id; 
                if(channel.url === activeUrl) div.classList.add('active');
                div.innerHTML = `
                    <div class="channel-logo-wrapper"><img class="channel-logo" src="${channel.logo}"></div>
                    <div class="channel-name">${channel.name}</div>
                    <button class="fav-btn ${isFav ? 'favorited' : ''}" onclick="toggleFav(event, '${channel.id}')">${isFav ? '❤️' : '🤍'}</button>
                `;
                div.onclick = () => playChannel(channel);
                container.appendChild(div);

                const fsCard = document.createElement('div');
                fsCard.className = 'fs-channel-card';
                fsCard.dataset.id = channel.id;
                if(channel.url === activeUrl) fsCard.classList.add('active');
                fsCard.innerHTML = `
                    <img class="fs-card-logo" src="${channel.logo}">
                    <span class="fs-card-name">${channel.name}</span>
                `;
                fsCard.onclick = (e) => {
                    e.stopPropagation(); 
                    playChannel(channel);
                    resetFsTimer();
                };
                fsChannelsContainer.appendChild(fsCard);
            });
            makeScrollableOnFocus();
        }

        function updateActiveChannelUI(id) {
            document.querySelectorAll('.channel-item, .fs-channel-card').forEach(el => {
                el.classList.toggle('active', el.dataset.id === id);
            });
        }

        function toggleFav(e, id) {
            e.stopPropagation();
            favorites.includes(id) ? favorites = favorites.filter(i => i !== id) : favorites.push(id);
            localStorage.setItem('ronika_favs', JSON.stringify(favorites));
            filterChannels(currentCategory);
        }

        function filterChannels(cat) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            const activeTab = document.getElementById('tab-' + cat);
            if(activeTab) activeTab.classList.add('active');
            
            let filtered = cat === 'all' ? myChannels : (cat === 'fav' ? myChannels.filter(c => favorites.includes(c.id)) : myChannels.filter(c => c.category === cat));
            let term = document.getElementById('search-input').value.toLowerCase();
            if(term) filtered = filtered.filter(c => c.name.toLowerCase().includes(term));
            renderChannels(filtered);
        }

        function searchChannels() { filterChannels(currentCategory); }

        video.addEventListener('waiting', () => loader.style.display = 'block');
        video.addEventListener('playing', () => loader.style.display = 'none');

        function playChannel(channel) {
            activeUrl = channel.url;
            const safeUrl = decodeUrl(channel.url);

            channelTitle.innerText = channel.name;
            fsChannelTitle.innerText = channel.name; 

            // --- پاک کردن خودکار کادر جستجو ---
            const searchInput = document.getElementById('search-input');
            if (searchInput.value !== '') {
                searchInput.value = ''; 
                filterChannels(currentCategory); 
            }

            updateActiveChannelUI(channel.id); 

            // --- کد جدید: پیدا کردن جای دقیق کانال در لیست و اسکرول به آن ---
            setTimeout(() => {
                const activeItem = document.querySelector(`.channel-item[data-id="${channel.id}"]`);
                if (activeItem) {
                    // لیست را جابجا می‌کند تا کانال انتخابی دقیقاً در مرکز دید قرار بگیرد
                    activeItem.scrollIntoView({ behavior: "smooth", block: "center" });
                }
            }, 50); // یک تأخیر 50 میلی‌ثانیه‌ای تا مطمئن شویم لیست کامل ساخته شده است
            // ---------------------------------------------------------------

            loader.style.display = 'block'; 
            document.getElementById('quality-selector').style.display = 'none';
            document.getElementById('fs-quality-selector').style.display = 'none';

            if (hls) hls.destroy(); 
            video.pause();

           if (channel.type === "iframe") {
                video.style.display = 'none';
                iframePlayer.style.display = 'block';
                iframePlayer.src = safeUrl;
                loader.style.display = 'none';
                
                // سیستم هوشمند فعال‌سازی برش قاب
                if (channel.crop === true) {
                    iframePlayer.classList.add('cropped-mode');
                } else {
                    iframePlayer.classList.remove('cropped-mode');
                }
                
            } else {
                // اگر کانال عادی بود، هم Iframe مخفی می‌شه و هم زوم لغو می‌شه
                iframePlayer.style.display = 'none';
                iframePlayer.classList.remove('cropped-mode');
                iframePlayer.src = "";
                iframePlayer.src = "";
                video.style.display = 'block';

                if (Hls.isSupported()) {
                    hls = new Hls({ maxBufferLength: 10, liveSyncDurationCount: 3 });
                    hls.loadSource(safeUrl);
                    hls.attachMedia(video);

                    hls.on(Hls.Events.MANIFEST_PARSED, (e, data) => {
                        video.play();
                        video.setAttribute("controls", "controls");
                        setupQuality(data.levels);
                    });

                    hls.on(Hls.Events.ERROR, (e, data) => {
                        if (data.fatal) {
                            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                                
                                // --- سیستم هوشمند جستجوی سرور تلوبیون ---
                                if (safeUrl.includes("telewebion.ir")) {
                                    let currentServerMatch = safeUrl.match(/live-azd(\d+)/);
                                    if (currentServerMatch) {
                                        let currentNum = parseInt(currentServerMatch[1]);
                                        // اگر از 1109 بیشتر شد برگردد به 1101
                                        let nextNum = currentNum >= 1109 ? 1101 : currentNum + 1;
                                        
                                        safeUrl = safeUrl.replace(`live-azd${currentNum}`, `live-azd${nextNum}`);
                                        hls.loadSource(safeUrl);
                                        hls.startLoad();
                                        return;
                                    }
                                }
                                // ------------------------------------------

                                hls.startLoad(); 
                            }
                            else { 
                                hls.destroy(); 
                                loader.style.display = 'none'; 
                            }
                        }
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = safeUrl;
                    video.setAttribute("controls", "controls");
                    video.play();
                }
            }
        }

        function setupQuality(levels) {
            const sel1 = document.getElementById('quality-selector');
            const sel2 = document.getElementById('fs-quality-selector');
            if (levels.length > 1) {
                let html = '<option value="-1">Auto</option>';
                levels.forEach((l, i) => html += `<option value="${i}">${l.height}p</option>`);
                sel1.innerHTML = html; sel2.innerHTML = html;
                sel1.style.display = 'block'; sel2.style.display = 'block';
            } else {
                sel1.style.display = 'none'; sel2.style.display = 'none';
            }
        }

        function changeQuality(val) { 
            if(hls) hls.currentLevel = parseInt(val); 
            document.getElementById('quality-selector').value = val;
            document.getElementById('fs-quality-selector').value = val;
            resetFsTimer();
        }

        // سیستم جدید و چندگانه Fit Screen
        const fitModes = ['contain', 'cover', 'fill'];
        const fitLabels = ['Aspect: Fit', 'Aspect: Crop', 'Aspect: Stretch'];
        let currentFitIndex = 0;

// سیستم هوشمند تصویر در تصویر (PiP)
async function togglePiP() {
    // بررسی اینکه آیا مرورگر/گوشی از این قابلیت پشتیبانی می‌کند یا خیر
    if (!document.pictureInPictureEnabled) {
        alert(currentLang === 'ku' ? "ببورە، مۆبایلەکەت پشتگیری ئەم تایبەتمەندییە ناکات!" : "Sorry, your device doesn't support Picture-in-Picture!");
        return;
    }

    // بررسی اینکه آیا کانال از نوع Iframe است (چون PiP روی سایت‌های واسطه کار نمی‌کند)
    if (iframePlayer.style.display === 'block') {
        alert(currentLang === 'ku' ? "ئەم تایبەتمەندییە بۆ ئەم کەناڵە کار ناکات." : "PiP is not supported for this specific channel.");
        return;
    }

    try {
        // اگر ویدیو در حالت PiP است، آن را ببند؛ در غیر این صورت بازش کن
        if (document.pictureInPictureElement) {
            await document.exitPictureInPicture();
        } else {
            await video.requestPictureInPicture();
        }
    } catch (error) {
        console.error("PiP Error:", error);
    }
}

        function toggleFit() { 
            currentFitIndex = (currentFitIndex + 1) % fitModes.length;
            video.style.objectFit = fitModes[currentFitIndex];
            document.getElementById('fs-fit-btn').innerText = fitLabels[currentFitIndex];
            resetFsTimer();
        }

        // کنترل‌های فول اسکرین
        const targetFS = document.getElementById('video-wrapper');
        const clickOverlay = document.getElementById('click-overlay');
        const fsUiElements = document.querySelectorAll('.fs-ui');
        let uiTimeout;

        function enterFS() {
            document.body.classList.add('pseudo-fs-active'); // مخفی کردن هدر و سایدبار
            clickOverlay.style.display = 'block'; 
            resetFsTimer();
            if(video.hasAttribute("controls")) video.removeAttribute("controls");
        }

        function exitFS() {
            document.body.classList.remove('pseudo-fs-active'); // برگرداندن هدر و سایدبار
            fsUiElements.forEach(el => el.classList.remove('active'));
            video.setAttribute("controls", "controls"); 
            clickOverlay.style.display = 'none';
            try { if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e) {}
        }

        function toggleCustomFullscreen() {
            if (!document.fullscreenElement && !targetFS.classList.contains('pseudo-fs')) {
                // تلاش برای فول اسکرین واقعی
                if (targetFS.requestFullscreen) {
                    targetFS.requestFullscreen().then(() => enterFS()).catch(() => {
                        targetFS.classList.add('pseudo-fs');
                        enterFS();
                    });
                } else if (targetFS.webkitRequestFullscreen) {
                    targetFS.webkitRequestFullscreen();
                } else {
                    targetFS.classList.add('pseudo-fs');
                    enterFS();
                }
                try { screen.orientation.lock('landscape').catch(e=>{}); } catch(e) {}
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else {
                    targetFS.classList.remove('pseudo-fs');
                    exitFS();
                }
            }
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) exitFS();
            else enterFS();
        });

        // سیستم هوشمند چرخش گوشی (ورود و خروج اتوماتیک به فول‌اسکرین)
        window.addEventListener("orientationchange", function() {
            setTimeout(() => {
                if(window.orientation === 90 || window.orientation === -90) {
                    if (!document.fullscreenElement && !targetFS.classList.contains('pseudo-fs')) {
                        toggleCustomFullscreen(); // ورود اتوماتیک
                    }
                } else {
                    if (targetFS.classList.contains('pseudo-fs')) {
                        toggleCustomFullscreen(); // خروج اتوماتیک
                    }
                }
            }, 200);
        });

        clickOverlay.addEventListener('click', (e) => {
            if(document.fullscreenElement || targetFS.classList.contains('pseudo-fs')) {
                resetFsTimer();
                if(video.hasAttribute("controls")) video.removeAttribute("controls");
                else video.setAttribute("controls", "controls");
            } else {
                if(video.paused) video.play(); else video.pause();
            }
        });

        function resetFsTimer() {
            fsUiElements.forEach(el => el.classList.add('active'));
            clearTimeout(uiTimeout);
            uiTimeout = setTimeout(() => {
                fsUiElements.forEach(el => el.classList.remove('active'));
            }, 4000);
        }

        const fsFooter = document.getElementById('fs-footer');
        fsFooter.addEventListener('touchstart', () => clearTimeout(uiTimeout), {passive: true});
        fsFooter.addEventListener('touchmove', () => clearTimeout(uiTimeout), {passive: true});
        fsFooter.addEventListener('touchend', resetFsTimer);
        fsFooter.addEventListener('mouseenter', () => clearTimeout(uiTimeout));
        fsFooter.addEventListener('mouseleave', resetFsTimer);

        const uiText = {
    ku: { label: "خەریکی بینینی", noSelect: "تکایە کەناڵێک هەڵبژێرە", all: "🌐 هەموو", news: "📰 هەواڵ", ent: "📺 کات بەسەربردن", movie: "🍿 فیلم", kids: "👶 منداڵان", doc: "🌍 دۆکیۆمێنتاری", sports: "⚽ وەرزش", fav: "⭐ دڵخواز", music: "🎵 میوزیک", install: "📥 دابەزاندن", search: "🔍 گەڕان بۆ کەناڵ...", lang: "EN" },
    en: { label: "NOW PLAYING", noSelect: "Select a channel", all: "🌐 All", news: "📰 News", ent: "📺 Entertainment", movie: "🍿 Movies", kids: "👶 Kids", doc: "🌍 Documentary", sports: "⚽ Sports", fav: "⭐ Favs", music: "🎵 Music", install: "📥 Install", search: "🔍 Search...", lang: "KU" }
};

        let currentLang = 'ku';
        function toggleLanguage() {
            currentLang = currentLang === 'ku' ? 'en' : 'ku';
            const t = uiText[currentLang];
            document.documentElement.dir = currentLang === 'ku' ? 'rtl' : 'ltr';
            document.getElementById('label-playing').innerText = t.label;
            if(activeUrl === "") channelTitle.innerText = t.noSelect;
            document.getElementById('tab-all').innerText = t.all;
            document.getElementById('tab-news').innerText = t.news;
            document.getElementById('tab-ent').innerText = t.ent;
            document.getElementById('tab-movie').innerText = t.movie;
            document.getElementById('tab-kids').innerText = t.kids;
            document.getElementById('tab-doc').innerText = t.doc;
            document.getElementById('tab-sports').innerText = t.sports;
            document.getElementById('tab-fav').innerText = t.fav;
            document.getElementById('tab-music').innerText = t.music;
            document.getElementById('install-btn').innerText = t.install;
            document.getElementById('search-input').placeholder = t.search;
            document.getElementById('lang-btn').innerText = t.lang;
            
            // --- تغییر ترجمه کلمه کانال با زدن دکمه تغییر زبان ---
            const channelWordEl = document.getElementById('channel-word');
            if (channelWordEl) {
                channelWordEl.innerText = currentLang === 'en' ? 'Channels' : 'کەناڵ';
            }
            // ----------------------------------------------------
        }

        renderChannels(myChannels);

        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt !== null) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') { installBtn.style.display = 'none'; }
                deferredPrompt = null;
            }
        });

        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
